<template>
  <!-- Override the list of test classes used? (Maybe something set on the rollup or parsable in the trigger?) Does the new "testFor" syntax help here? -->
  <lightning-card>
    <c-deployment-monitor
      publish-toast-on-completion
      ondeploymentcompleted={handleDeploymentCompleted}
    ></c-deployment-monitor>
    <lightning-spinner lwc:if={isLoading}></lightning-spinner>
    <lightning-layout multiple-rows>
      <template for:each={generatedApex} for:item="apx">
        <lightning-layout-item
          size="7"
          medium-device-size="5"
          padding="around-medium"
          key={apx.assetName}
        >
          <template lwc:if={isAdvancedMode}>
            <lightning-select
              name={apx.assetName}
              data-mdt-type={apx.mdtType}
              label={apx.assetName}
              value={apx.changeType}
              options={apx.changeOptions}
            ></lightning-select>
          </template>
          <template lwc:else>
            <span
              >{apx.assetName}
              <lightning-icon
                class="slds-p-left_x-small"
                icon-name={apx.changeIcon}
                variant={apx.changeIconVariant}
                alternative-text={apx.changeIconAltText}
                size="x-small"
              ></lightning-icon>
              <lightning-helptext content={apx.changeIconAltText}>
              </lightning-helptext>
            </span>
          </template>
        </lightning-layout-item>
      </template>
    </lightning-layout>
    <lightning-layout multiple-rows>
      <lightning-layout-item size="6">
        <lightning-input
          type="toggle"
          label="Advanced"
          value={isAdvancedMode}
          onchange={handleAdvancedToggle}
          message-toggle-inactive=""
          message-toggle-active=""
        ></lightning-input>
      </lightning-layout-item>
      <lightning-layout-item size="6" lwc:if={isAdvancedMode}>
        <lightning-select
          name="TestLevel"
          label="Test Level"
          value={testLevel}
          options={testLevelOptions}
          onchange={handleTestLevelChange}
        ></lightning-select>
      </lightning-layout-item>
      <lightning-layout-item size="12" lwc:if={shouldDisplayTestInput}>
        <lightning-input
          label="Additional Test Classes"
          field-level-help="Comma-separated names of test classes to run during deployment"
          lwc:ref="testsToRun"
        ></lightning-input>
      </lightning-layout-item>
    </lightning-layout>
    <lightning-tabset>
      <template for:each={generatedApex} for:item="apx">
        <lightning-tab label={apx.assetName} key={apx.assetName}>
          Type: <strong>{apx.mdtType}</strong> API Version:
          <strong>{apx.apiVersion}</strong>
          <template lwc:if={apx.needsApiUpdate}>
            <span style="text-decoration: line-through"
              >{apx.existingApiVersion}</span
            > </template
          ><br />
          <pre>{apx.body}</pre>
          <br />
          <template lwc:if={apx.needsBodyUpdate}>
            Existing:
            <pre style="text-decoration: line-through">{apx.existingBody}</pre>
          </template>
        </lightning-tab>
      </template>
    </lightning-tabset>
  </lightning-card>
</template>
